name: Refinement Browser Review

on:
  push:
    branches: [audit/product-refinement-2026-09-06]
    paths:
      - .github/workflows/refinement-audit-bootstrap.yml
      - test/product-refinement.browser.mjs

permissions:
  contents: read

jobs:
  browser-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Inspect disposable demo household
        env:
          AUDIT_LABEL: baseline
          QA_OUTPUT_DIR: review-artifacts
        run: node test/product-refinement.browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yuvomi-browser-review
          path: review-artifacts/
          retention-days: 1
          if-no-files-found: error
