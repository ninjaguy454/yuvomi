name: Debug round-robin full tests

on:
  push:
    branches:
      - feat/round-robin-task-assignment

permissions:
  contents: write

jobs:
  full-test-log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/round-robin-task-assignment
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - name: Add rotation component to service-worker precache
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('public/sw.js')
          text = path.read_text()
          entry = "  '/components/user-rotation-order.js',\n"
          if entry not in text:
              anchor = "  '/components/user-multi-select.js',\n"
              if anchor not in text:
                  raise SystemExit('precache anchor missing')
              text = text.replace(anchor, anchor + entry, 1)
              path.write_text(text)
          PY
      - run: npm ci
      - name: Run focused rotation and compatibility tests
        run: |
          npm run test:task-round-robin
          npm run test:tasks-recurrence
          npm run test:multi-assignment
          npm run test:migrations-append-only
          npm run test:schema-reconcile
          npm run test:schema-mirror
          npm run test:sw-precache
      - name: Commit precache compatibility fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- public/sw.js; then
            git add public/sw.js
            git commit -m "fix(pwa): precache rotation order component"
            git push origin HEAD:feat/round-robin-task-assignment
          fi
      - name: Run full upstream test suite
        id: tests
        shell: bash
        run: |
          set +e
          npm test > full-test.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: final-full-test-log
          path: full-test.log
      - name: Preserve failure status
        if: steps.tests.outputs.status != '0'
        run: exit 1
