name: Apply task activity bindings

on:
  push:
    branches: [feat/activity-templates-skills-quick-add]
    paths:
      - '.github/workflows/apply-task-activity-bindings.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/activity-templates-skills-quick-add
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
      - run: python .github/scripts/apply-task-activity-bindings.py
      - run: node --check server/services/task-activity-bindings.js
      - run: node --check server/routes/automation.js
      - run: node --check server/routes/tasks.js
      - run: node --check public/pages/tasks.js
      - run: npm ci
      - run: npm run test:migrations-append-only
      - run: npm run test:schema-reconcile
      - run: npm run test:schema-mirror
      - run: npm run test:activity-automation
      - run: npm run test:activity-automation-routes
      - run: npm run test:task-activity-bindings
      - run: npm run test:tasks-routes
      - run: npm run test:tasks-recurrence
      - run: npm run test:task-round-robin
      - run: npm run test:multi-assignment
      - run: npm run test:task-documents
      - run: npm run test:sw-precache
      - run: npm run test:frontend-audit
      - run: npm run test:mobile-scroll-layout
      - name: Commit patched files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/db.js server/routes/automation.js server/routes/tasks.js public/pages/tasks.js package.json
          if git diff --cached --quiet; then
            echo 'No patch changes to commit.'
            exit 0
          fi
          git commit -m 'feat(automation): bind recurring tasks to activity templates'
          git push origin HEAD:feat/activity-templates-skills-quick-add
