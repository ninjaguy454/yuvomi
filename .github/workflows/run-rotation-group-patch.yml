name: Run rotation group patch
on:
  push:
    branches: [feat/round-robin-task-assignment]
permissions:
  contents: write
jobs:
  apply:
    if: github.event.head_commit.message == 'build: run rotation group patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/round-robin-task-assignment
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Extract and apply patch
        run: |
          awk 'BEGIN{f=0} /python3 <<.PY./{f=1;next} /^          PY$/{f=0} f{sub(/^          /,""); print}' .github/workflows/apply-rotation-groups.yml > /tmp/rotation-group-patch.py
          python3 /tmp/rotation-group-patch.py
      - name: Install dependencies
        run: npm ci
      - name: Run focused compatibility tests
        run: |
          npm run test:task-round-robin
          npm run test:tasks-recurrence
          npm run test:multi-assignment
          npm run test:migrations-append-only
          npm run test:schema-reconcile
          npm run test:schema-mirror
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/db.js server/routes/tasks.js public/pages/tasks.js test/test-task-round-robin.js package.json docs/ROUND_ROBIN_TASKS.md
          git commit -m "feat(tasks): add synchronized rotation groups"
          git push origin HEAD:feat/round-robin-task-assignment