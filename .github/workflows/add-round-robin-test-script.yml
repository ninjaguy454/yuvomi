name: Wire round-robin test into npm suite
on:
  push:
    branches: [feat/round-robin-task-assignment]
permissions:
  contents: write
jobs:
  wire-test:
    if: github.event.head_commit.message == 'ci: wire round-robin test into npm suite'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/round-robin-task-assignment
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Update package scripts
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          pkg.scripts['test:task-round-robin'] = 'node --test test/test-task-round-robin.js';
          const anchor = 'npm run test:tasks-recurrence';
          const addition = `${anchor} && npm run test:task-round-robin`;
          if (!pkg.scripts.test.includes('npm run test:task-round-robin')) {
            if (!pkg.scripts.test.includes(anchor)) throw new Error('master test chain anchor not found');
            pkg.scripts.test = pkg.scripts.test.replace(anchor, addition);
          }
          fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
          NODE
      - name: Commit package script
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "test(tasks): include round-robin test in full suite"
          git push origin HEAD:feat/round-robin-task-assignment
