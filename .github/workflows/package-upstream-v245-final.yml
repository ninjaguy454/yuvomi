name: Package clean upstream v2.45 merge

on:
  push:
    paths:
      - '.github/workflows/package-upstream-v245-final.yml'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sync/upstream-2.45
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build a clean merge from main and immutable v2.45.0
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          src = Path('.github/workflows/sync-upstream-apply.yml').read_text()
          marker = '      - name: Merge upstream and resolve fork integration\n        shell: bash\n        run: |\n'
          start = src.index(marker) + len(marker)
          end = src.index('\n      - name: Install dependencies', start)
          block = src[start:end]
          lines = []
          for line in block.splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          script = '\n'.join(lines) + '\n'
          script = script.replace('git fetch upstream main', 'git fetch upstream tag v2.45.0')
          script = script.replace('upstream/main', 'v2.45.0')
          Path('/tmp/apply-v245.sh').write_text(script)
          PY
          git fetch origin main
          git reset --hard origin/main
          bash /tmp/apply-v245.sh
      - name: Install dependencies
        run: npm ci
      - name: Run focused compatibility tests
        run: |
          npm run test:migrations-append-only
          npm run test:fork-migration-remap
          npm run test:schema-reconcile
          npm run test:schema-mirror
          npm run test:tasks-recurrence
          npm run test:task-round-robin
          npm run test:task-completions
          npm run test:activity-automation
          npm run test:activity-automation-routes
          npm run test:task-activity-bindings
          npm run test:tasks-routes
          npm run test:frontend-audit
          npm run test:mobile-scroll-layout
          npm run test:suite-chain
      - name: Run full repository suite
        run: npm test
      - name: Commit and publish the tested merge
        shell: bash
        run: |
          set -euo pipefail
          # Workflow-file changes are applied with the authenticated GitHub connector
          # after this job, because Actions tokens cannot publish workflow updates.
          git checkout HEAD -- .github/workflows
          git add -A
          if git diff --name-only --diff-filter=U | grep -q .; then
            git diff --name-only --diff-filter=U
            exit 1
          fi
          git status --short
          git commit -m "Merge upstream Yuvomi v2.45.0 with fork automation"
          git push origin HEAD:sync/upstream-2.45-final
