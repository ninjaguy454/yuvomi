name: Phase 0 workflow editor dependencies v2

on:
  push:
    paths:
      - '.github/workflows/phase0-workflow-editor-deps-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/activity-templates-skills-quick-add
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Preserve workflow dependencies while editing steps
        shell: python
        run: |
          from pathlib import Path
          import re

          def replace_once(text, old, new, label):
              count = text.count(old)
              assert count == 1, f'{label}: expected one match, got {count}'
              return text.replace(old, new, 1)

          def sub_once(text, pattern, replacement, label):
              out, count = re.subn(pattern, lambda _m: replacement, text, count=1, flags=re.S)
              assert count == 1, f'{label}: expected one match, got {count}'
              return out

          p = Path('public/components/activity-automation.js')
          s = p.read_text()
          s = replace_once(
              s,
              'function workflowStepHtml(step, index, activities) {\n  return `<div data-workflow-step style="',
              "let workflowDraftStepSequence = 0;\n\nfunction workflowStepHtml(step, index, activities) {\n  const workflowKey = step?.step_key || `draft_${++workflowDraftStepSequence}`;\n  const initialDependency = step?.depends_on?.[0] || '';\n  return `<div data-workflow-step data-workflow-key=\"${h(workflowKey)}\" data-initial-dependency=\"${h(initialDependency)}\" style=\"",
              'workflow row identity',
          )

          refresh = '''      const refreshStepDependencies = () => {
            const rows = [...steps.querySelectorAll('[data-workflow-step]')];
            rows.forEach((row, index) => {
              row.querySelector('strong').textContent = `Step ${index + 1}`;
              const select = row.querySelector('[data-step-dependency]');
              const old = select.value;
              const existing = row.dataset.initialDependency || '';
              select.innerHTML = '<option value="">No dependency</option>' + rows.slice(0, index).map((priorRow, prior) =>
                `<option value="${h(priorRow.dataset.workflowKey)}">After step ${prior + 1}</option>`
              ).join('');
              const wanted = old || existing;
              if ([...select.options].some((option) => option.value === wanted)) select.value = wanted;
              delete row.dataset.initialDependency;
            });
          };
          refreshStepDependencies();'''
          refresh = '\n'.join(line[10:] if line.startswith('          ') else line for line in refresh.splitlines())
          s = sub_once(
              s,
              r"      const refreshStepDependencies = \(\) => \{.*?      \};\n      refreshStepDependencies\(\);",
              refresh,
              'dependency dropdown remapping',
          )

          payload = '''        const stepRows = [...steps.querySelectorAll('[data-workflow-step]')];
            const savedKeyByDraftKey = new Map(
              stepRows.map((row, index) => [row.dataset.workflowKey, `step_${index + 1}`])
            );
            const stepPayload = stepRows.map((row, index) => {
              const conditionKey = row.querySelector('[data-step-condition-key]').value.trim();
              const conditionValue = row.querySelector('[data-step-condition-value]').value;
              const dependencyDraftKey = row.querySelector('[data-step-dependency]').value;
              const dependency = dependencyDraftKey ? savedKeyByDraftKey.get(dependencyDraftKey) : null;
              return {
                step_key: `step_${index + 1}`,
                activity_template_id: Number(row.querySelector('[data-step-activity]').value),
                title_override: row.querySelector('[data-step-title]').value.trim() || null,
                depends_on: dependency ? [dependency] : [],
                condition: conditionKey ? { input: conditionKey, equals: parseEquals(conditionValue) } : null,
              };
            });

            const payload = {'''
          payload = '\n'.join(line[10:] if line.startswith('          ') else line for line in payload.splitlines())
          s = sub_once(
              s,
              r"        const stepPayload = \[\.\.\.steps\.querySelectorAll\('\[data-workflow-step\]'\)\]\.map\(\(row, index\) => \{.*?        \}\);\n\n        const payload = \{",
              payload,
              'dependency save remapping',
          )
          p.write_text(s)
      - run: npm ci
      - run: npm run test:frontend-audit
      - run: npm run test:mobile-scroll-layout
      - run: npm run test:activity-automation-routes
      - name: Commit editor fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/components/activity-automation.js
          git diff --cached --quiet || git commit -m "fix(automation): preserve workflow dependencies while editing"
          git push origin HEAD:feat/activity-templates-skills-quick-add
