name: Fix upstream sync staging

on:
  push:
    paths:
      - '.github/workflows/fix-sync-staging.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: sync/upstream-2.45
      - name: Ensure resolved merge files are staged
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/sync-upstream-apply.yml')
          text = p.read_text()
          old = "          git add test\n          if git diff --name-only --diff-filter=U | grep -q .; then\n"
          new = "          git add -A\n          if git diff --name-only --diff-filter=U | grep -q .; then\n"
          if old not in text:
              raise SystemExit('pre-test staging marker not found')
          text = text.replace(old, new, 1)
          old = "      - name: Commit merged upstream\n        shell: bash\n        run: |\n          git status --short\n          git commit -m \"Merge upstream Yuvomi v2.45 with fork automation\"\n"
          new = "      - name: Commit merged upstream\n        shell: bash\n        run: |\n          git add -A\n          if git diff --name-only --diff-filter=U | grep -q .; then\n            git diff --name-only --diff-filter=U\n            exit 1\n          fi\n          git status --short\n          git commit -m \"Merge upstream Yuvomi v2.45 with fork automation\"\n"
          if old not in text:
              raise SystemExit('commit staging marker not found')
          p.write_text(text.replace(old, new, 1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/sync-upstream-apply.yml
          git commit -m "chore: stage resolved files before upstream sync commit"
          git push origin HEAD:sync/upstream-2.45
