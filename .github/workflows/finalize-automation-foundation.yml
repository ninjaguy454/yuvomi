name: Finalize automation foundation

on:
  push:
    branches: [feat/activity-templates-skills-quick-add]
    paths:
      - '.github/scripts/finalize-automation-foundation.py'
      - '.github/workflows/finalize-automation-foundation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/activity-templates-skills-quick-add
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
      - run: python .github/scripts/finalize-automation-foundation.py
      - run: node --check public/pages/tasks.js
      - run: npm ci
      - run: npm run test:activity-automation
      - run: npm run test:activity-automation-routes
      - run: npm run test:tasks-routes
      - run: npm run test:frontend-audit
      - run: npm run test:mobile-scroll-layout
      - run: npm run test:sw-precache
      - name: Commit finalized files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json test/test-activity-automation-routes.js server/routes/tasks.js public/pages/tasks.js public/styles/tasks.css
          git commit -m "feat(automation): integrate automation tests and assignee visibility" || exit 0
          git push
