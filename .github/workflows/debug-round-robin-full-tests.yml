name: Debug round-robin full tests

on:
  push:
    branches:
      - feat/round-robin-task-assignment

jobs:
  full-test-log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - name: Run full tests and capture log
        id: tests
        shell: bash
        run: |
          set +e
          npm test > full-test.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: full-test-log
          path: full-test.log
      - name: Preserve failure status
        if: steps.tests.outputs.status != '0'
        run: exit 1
