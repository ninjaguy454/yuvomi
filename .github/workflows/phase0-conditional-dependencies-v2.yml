name: Phase 0 conditional dependencies v2

on:
  push:
    paths:
      - '.github/workflows/phase0-conditional-dependencies-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/activity-templates-skills-quick-add
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Resolve dependencies through skipped conditional steps
        shell: python
        run: |
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              assert count == 1, f'{label}: expected one match, got {count}'
              return text.replace(old, new, 1)

          p = Path('server/services/activity-workflows.js')
          s = p.read_text()

          helper = '''/**
           * Resolve dependencies through conditional steps that were skipped.
           * If C depends on optional B, and B is skipped but B depended on A,
           * C still waits for A instead of becoming accidentally unblocked.
           */
          function activeDependencyKeys(workflow, activeStepKeys, step) {
            const byKey = new Map(workflow.steps.map((candidate) => [candidate.step_key, candidate]));
            const resolved = [];
            const visited = new Set();

            const visit = (key) => {
              if (!key || visited.has(key)) return;
              visited.add(key);
              if (activeStepKeys.has(key)) {
                resolved.push(key);
                return;
              }
              const skipped = byKey.get(key);
              for (const predecessor of skipped?.depends_on ?? []) visit(predecessor);
            };

            for (const predecessor of step.depends_on ?? []) visit(predecessor);
            return [...new Set(resolved)];
          }

          '''
          # Strip the YAML/Python block indentation from the JS helper only.
          helper = '\n'.join(line[10:] if line.startswith('          ') else line for line in helper.splitlines()) + '\n'
          s = replace_once(s, 'function userById(d, id) {', helper + 'function userById(d, id) {', 'dependency helper')
          s = replace_once(
              s,
              '      depends_on: step.depends_on.filter((key) => activeStepKeys.has(key)),',
              '      depends_on: activeDependencyKeys(workflow, activeStepKeys, step),',
              'preview dependency resolution',
          )
          s = replace_once(
              s,
              "  const activeSteps = workflow.steps.filter((step) => conditionMatches(step.condition, runtimeInputs));\n  if (!activeSteps.length) throw new Error('No activities apply to these answers.');\n\n  return d.transaction(() => {",
              "  const activeSteps = workflow.steps.filter((step) => conditionMatches(step.condition, runtimeInputs));\n  if (!activeSteps.length) throw new Error('No activities apply to these answers.');\n  const activeStepKeys = new Set(activeSteps.map((step) => step.step_key));\n\n  return d.transaction(() => {",
              'instantiate active step keys',
          )
          s = replace_once(
              s,
              '      for (const predecessorKey of step.depends_on) {',
              '      for (const predecessorKey of activeDependencyKeys(workflow, activeStepKeys, step)) {',
              'instantiate dependency resolution',
          )
          p.write_text(s)

          p = Path('test/test-activity-automation-routes.js')
          s = p.read_text()
          s = replace_once(
              s,
              "  assert.deepEqual(falsePreview.body.data.steps.find((step) => step.step_key === 'finish').depends_on, []);",
              "  assert.deepEqual(falsePreview.body.data.steps.find((step) => step.step_key === 'finish').depends_on, ['start']);",
              'preview rewired dependency assertion',
          )
          old = """  const falseFinish = falseCreated.body.data.tasks.find((task) => task.step_key === 'finish');
            assert.deepEqual(
              db.prepare('SELECT depends_on_task_id FROM workflow_task_dependencies WHERE task_id = ?').all(falseFinish.task_id),
              [],
            );"""
          new = """  const falseStart = falseCreated.body.data.tasks.find((task) => task.step_key === 'start');
            const falseFinish = falseCreated.body.data.tasks.find((task) => task.step_key === 'finish');
            assert.deepEqual(
              db.prepare('SELECT depends_on_task_id FROM workflow_task_dependencies WHERE task_id = ?').all(falseFinish.task_id),
              [{ depends_on_task_id: falseStart.task_id }],
            );"""
          old = '\n'.join(line[10:] if line.startswith('          ') else line for line in old.splitlines())
          new = '\n'.join(line[10:] if line.startswith('          ') else line for line in new.splitlines())
          s = replace_once(s, old, new, 'created rewired dependency assertion')
          p.write_text(s)
      - run: npm ci
      - run: npm run test:activity-automation-routes
      - run: npm run test:activity-automation
      - run: npm run test:task-activity-bindings
      - name: Commit dependency fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add server/services/activity-workflows.js test/test-activity-automation-routes.js
          git diff --cached --quiet || git commit -m "fix(automation): preserve dependencies across skipped branches"
          git push origin HEAD:feat/activity-templates-skills-quick-add
