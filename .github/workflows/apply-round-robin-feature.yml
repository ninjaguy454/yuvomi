name: Apply round-robin task feature

on:
  push:
    branches:
      - feat/round-robin-task-assignment

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/round-robin-task-assignment
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm

      - name: Apply feature patch
        run: node scripts/apply-round-robin-feature.mjs

      - name: Install dependencies
        run: npm ci

      - name: Test round robin
        run: node --test test/test-task-round-robin.js

      - name: Test existing task recurrence
        run: npm run test:tasks-recurrence

      - name: Test existing multi-assignment
        run: npm run test:multi-assignment

      - name: Commit applied feature
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Feature already applied; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/db.js server/routes/tasks.js public/pages/tasks.js
          git commit -m "feat(tasks): add round-robin recurring assignment"
          git push origin HEAD:feat/round-robin-task-assignment
