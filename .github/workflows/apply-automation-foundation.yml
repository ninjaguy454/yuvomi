name: Apply automation foundation

on:
  push:
    branches: [feat/activity-templates-skills-quick-add]
    paths:
      - '.github/workflows/apply-automation-foundation.yml'
      - '.github/scripts/apply-automation-foundation.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/activity-templates-skills-quick-add
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
      - run: python .github/scripts/apply-automation-foundation.py
      - run: node --check server/services/activity-eligibility.js
      - run: node --check server/services/activity-workflows.js
      - run: node --check server/routes/automation.js
      - run: node --check public/components/activity-automation.js
      - run: node --check public/pages/tasks.js
      - run: npm ci
      - run: npm run test:migrations-append-only
      - run: npm run test:schema-mirror
      - run: npm run test:tasks-recurrence
      - run: npm run test:task-round-robin
      - run: npm run test:sw-precache
      - name: Commit patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/db.js server/index.js server/routes/tasks.js public/pages/tasks.js public/styles/tasks.css public/sw.js
          git commit -m "feat(automation): wire skills workflows and Quick Add" || exit 0
          git push
