name: Sync upstream conflict scan

on:
  push:
    paths:
      - '.github/workflows/sync-upstream-conflict-scan.yml'

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: sync/upstream-2.45
          fetch-depth: 0
      - name: Scan merge conflicts
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/ulsklyc/yuvomi.git
          git fetch upstream main
          set +e
          git merge --no-commit --no-ff upstream/main
          code=$?
          echo "MERGE_EXIT=$code"
          echo '--- conflicts ---'
          git diff --name-only --diff-filter=U || true
          echo '--- package conflict ---'
          git diff --cc -- package.json || true
          echo '--- db conflict ---'
          git diff --cc -- server/db.js || true
          echo '--- task route conflict ---'
          git diff --cc -- server/routes/tasks.js || true
          exit $code
