name: Product Refinement Review

on:
  push:
    branches: [audit/product-refinement-2026-09-06]
    paths:
      - .github/workflows/refinement-audit-bootstrap.yml
      - test/product-refinement-regressions.browser.mjs
      - public/**
      - package.json

permissions:
  contents: read

concurrency:
  group: yuvomi-product-refinement-review
  cancel-in-progress: false

jobs:
  browser-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run focused regression checks
        run: |
          mkdir -p review-artifacts
          set -o pipefail
          for suite in api sw-upgrade kitchen-tabs meal-change-notifications-migration suite-chain push region-presets frontend-audit; do
            npm run "test:$suite" 2>&1 | tee -a review-artifacts/focused-tests.log
          done
      - name: Inspect disposable demo household
        env:
          AUDIT_LABEL: refined
          QA_OUTPUT_DIR: review-artifacts
        run: |
          set -o pipefail
          node test/product-refinement-regressions.browser.mjs 2>&1 | tee review-artifacts/browser.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yuvomi-refined-review
          path: review-artifacts/
          retention-days: 7
          if-no-files-found: error
