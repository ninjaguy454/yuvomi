name: Phase 0 preview rotation consistency

on:
  push:
    paths:
      - '.github/workflows/phase0-preview-rotation.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/activity-templates-skills-quick-add
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Make workflow preview simulate rotation without consuming it
        shell: python
        run: |
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              assert count == 1, f'{label}: expected one match, got {count}'
              return text.replace(old, new, 1)

          p = Path('server/services/activity-workflows.js')
          s = p.read_text()
          old = """  const output = [];
            for (const step of activeSteps) {
              const activity = getActivityTemplate(d, step.activity_template_id);
              if (!activity || !activity.active) throw new Error(`Activity template unavailable: ${step.activity_name}`);
              const resolution = resolveActivityAssignment(d, activity, {
                subjectUserId: subject?.id ?? null,
                commitRotation: false,
              });
              output.push({
                step_key: step.step_key,
                activity_template_id: activity.id,
                activity_name: activity.name,
                title: stepTitle(activity, subject, step.title_override),
                assigned_to: resolution.primary,
                supervisor: resolution.supervisor,
                supervisor_title: resolution.supervisor ? supervisorTitle(activity, subject) : null,
                subject_proficiency: resolution.subjectProficiency?.proficiency ?? null,
                depends_on: activeDependencyKeys(workflow, activeStepKeys, step),
                category: activity.category,
              });
            }
          """
          new = """  // Simulate the same sequence of rotation writes that Create will perform,
            // then roll them all back. This matters when one workflow uses the same
            // round-robin Activity Template more than once: a read-only resolution
            // would show the same person for every step even though Create advances
            // the cursor between those steps.
            const output = [];
            const rollbackPreview = new Error('ROLLBACK_WORKFLOW_PREVIEW');
            try {
              d.transaction(() => {
                for (const step of activeSteps) {
                  const activity = getActivityTemplate(d, step.activity_template_id);
                  if (!activity || !activity.active) throw new Error(`Activity template unavailable: ${step.activity_name}`);
                  const resolution = resolveActivityAssignment(d, activity, {
                    subjectUserId: subject?.id ?? null,
                    commitRotation: true,
                  });
                  output.push({
                    step_key: step.step_key,
                    activity_template_id: activity.id,
                    activity_name: activity.name,
                    title: stepTitle(activity, subject, step.title_override),
                    assigned_to: resolution.primary,
                    supervisor: resolution.supervisor,
                    supervisor_title: resolution.supervisor ? supervisorTitle(activity, subject) : null,
                    subject_proficiency: resolution.subjectProficiency?.proficiency ?? null,
                    depends_on: activeDependencyKeys(workflow, activeStepKeys, step),
                    category: activity.category,
                  });
                }
                throw rollbackPreview;
              })();
            } catch (err) {
              if (err !== rollbackPreview) throw err;
            }
          """
          old = '\n'.join(line[10:] if line.startswith('          ') else line for line in old.splitlines()) + '\n'
          new = '\n'.join(line[10:] if line.startswith('          ') else line for line in new.splitlines()) + '\n'
          s = replace_once(s, old, new, 'preview assignment simulation')
          p.write_text(s)

          p = Path('test/test-activity-automation.js')
          s = p.read_text()
          assert 'workflow preview simulates repeated Activity Template rotation' not in s
          s += r'''

          test('workflow preview simulates repeated Activity Template rotation without consuming the cursor', () => {
            const skill = addSkill('Preview sequence skill', { minimumAge: 0, promotion: 'supervised' });
            setProficiency(grace, skill, 'normal');
            setProficiency(mom, skill, 'normal');
            const rotatingActivity = addActivity({
              name: 'Preview sequence activity',
              title: 'Preview sequence activity',
              strategy: 'eligible_round_robin',
              subjectRequired: 0,
              skillIds: [skill],
            });

            const workflowId = Number(db.prepare(`
              INSERT INTO workflow_templates (
                name, description, category, quick_add_enabled, subject_required,
                input_schema_json, active, created_by
              ) VALUES ('Preview sequence', NULL, 'misc', 1, 0, '[]', 1, ?)
            `).run(admin).lastInsertRowid);
            db.prepare(`
              INSERT INTO workflow_template_steps (
                workflow_template_id, activity_template_id, step_key, sort_order
              ) VALUES (?, ?, ?, ?)
            `).run(workflowId, rotatingActivity, 'first', 0);
            db.prepare(`
              INSERT INTO workflow_template_steps (
                workflow_template_id, activity_template_id, step_key, sort_order
              ) VALUES (?, ?, ?, ?)
            `).run(workflowId, rotatingActivity, 'second', 1);

            const before = db.prepare(`
              SELECT last_user_id FROM activity_rotation_state
               WHERE activity_template_id = ? AND purpose = 'primary'
            `).get(rotatingActivity)?.last_user_id ?? null;
            assert.equal(before, null);

            const preview = previewWorkflow(db, workflowId);
            assert.deepEqual(preview.steps.map((step) => step.assigned_to.id), [grace, mom]);

            const afterPreview = db.prepare(`
              SELECT last_user_id FROM activity_rotation_state
               WHERE activity_template_id = ? AND purpose = 'primary'
            `).get(rotatingActivity)?.last_user_id ?? null;
            assert.equal(afterPreview, null, 'preview must roll back its simulated cursor changes');

            const created = instantiateWorkflow(db, workflowId, { createdBy: admin });
            assert.deepEqual(created.tasks.map((task) => task.assigned_to.id), [grace, mom]);
            const afterCreate = db.prepare(`
              SELECT last_user_id FROM activity_rotation_state
               WHERE activity_template_id = ? AND purpose = 'primary'
            `).get(rotatingActivity)?.last_user_id ?? null;
            assert.equal(afterCreate, mom);
          });
          '''
          p.write_text(s)
      - run: npm ci
      - run: npm run test:activity-automation
      - run: npm run test:activity-automation-routes
      - run: npm run test:task-activity-bindings
      - name: Commit preview fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add server/services/activity-workflows.js test/test-activity-automation.js
          git diff --cached --quiet || git commit -m "fix(automation): keep workflow preview assignment accurate"
          git push origin HEAD:feat/activity-templates-skills-quick-add
