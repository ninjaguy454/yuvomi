name: Debug round-robin full tests

on:
  push:
    branches:
      - feat/round-robin-task-assignment

permissions:
  contents: write

jobs:
  full-test-log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/round-robin-task-assignment
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - name: Extract and apply rotation-group patch
        if: contains(github.event.head_commit.message, 'execute rotation group patch')
        run: |
          python3 .github/scripts/extract_rotation_group_patch.py
          python3 /tmp/rotation-group-patch.py
      - run: npm ci
      - name: Run focused compatibility tests
        if: contains(github.event.head_commit.message, 'execute rotation group patch')
        run: |
          npm run test:task-round-robin
          npm run test:tasks-recurrence
          npm run test:multi-assignment
          npm run test:migrations-append-only
          npm run test:schema-reconcile
          npm run test:schema-mirror
      - name: Commit rotation-group implementation
        if: contains(github.event.head_commit.message, 'execute rotation group patch')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/db.js server/routes/tasks.js public/pages/tasks.js test/test-task-round-robin.js package.json docs/ROUND_ROBIN_TASKS.md
          git commit -m "feat(tasks): add synchronized rotation groups"
          git push origin HEAD:feat/round-robin-task-assignment
      - name: Run full tests and capture log
        id: tests
        shell: bash
        run: |
          set +e
          npm test > full-test.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: full-test-log
          path: full-test.log
      - name: Preserve failure status
        if: steps.tests.outputs.status != '0'
        run: exit 1