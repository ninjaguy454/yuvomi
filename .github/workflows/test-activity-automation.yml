name: Test activity automation

on:
  push:
    branches: [feat/activity-templates-skills-quick-add]
    paths:
      - 'test/test-activity-automation.js'
      - 'test/test-activity-automation-routes.js'
      - '.github/workflows/test-activity-automation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/activity-templates-skills-quick-add
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: node --experimental-sqlite --test test/test-activity-automation.js
      - run: SESSION_SECRET=test-session-secret-at-least-32-characters-long node --experimental-sqlite --test test/test-activity-automation-routes.js
      - run: npm run test:tasks-routes
      - run: npm run test:tasks-recurrence
      - run: npm run test:task-round-robin
      - run: npm run test:sw-precache
      - run: npm run test:frontend-audit
      - run: npm run test:mobile-scroll-layout
